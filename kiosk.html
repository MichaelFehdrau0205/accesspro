<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Pro: check-in kiosk</title>
<style>
  :root { --bg:#000; --ink:#ffe600; --white:#fff; --line:#6b6b6b; --panel:#111; --blue:#6ea0ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--white); font:22px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-user-select:none; user-select:none; }
  input, textarea { -webkit-user-select:text; user-select:text; }
  .kiosk { min-height:100%; display:flex; flex-direction:column; padding: 24px; max-width: 1100px; margin: 0 auto; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:12px; color:var(--ink); font-weight:800; font-size:20px; margin-bottom:12px; }
  .bar .loc { color:#bbb; font-weight:600; }
  .screen { display:none; flex:1; flex-direction:column; justify-content:center; }
  .screen.on { display:flex; }
  h1 { font-size: clamp(36px, 7vw, 76px); line-height:1.05; margin:0 0 16px; color:var(--ink); font-weight:900; }
  h2 { font-size: clamp(28px, 4.5vw, 44px); line-height:1.15; margin:0 0 14px; color:var(--ink); font-weight:800; }
  p { margin: 0 0 14px; }
  .sub { color:var(--white); font-size: clamp(20px, 3vw, 30px); }
  .mute { color:#bbb; font-size:18px; }
  .btn { min-height:72px; padding:14px 28px; border-radius:18px; border:3px solid var(--ink); background:var(--ink); color:#000; font:inherit; font-weight:900; font-size:28px; cursor:pointer; }
  .btn.alt { background:transparent; color:var(--ink); }
  .btn.big { min-height:110px; font-size:40px; width:100%; }
  .btn[disabled] { opacity:.4; }
  .row { display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; }
  .row > .btn { flex:1; min-width:180px; }
  .grid { display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .opt { display:flex; align-items:center; gap:16px; min-height:84px; padding:14px 18px; border:3px solid var(--line); border-radius:18px; background:var(--panel); cursor:pointer; font-size:26px; text-align:left; color:var(--white); font-family:inherit; width:100%; }
  .opt input { width:36px; height:36px; flex:none; accent-color: var(--ink); }
  .opt[aria-pressed="true"], .opt:has(input:checked) { border-color:var(--ink); background:#262200; font-weight:800; }
  .langs { display:flex; gap:12px; flex-wrap:wrap; margin: 14px 0; }
  .langs .opt { width:auto; min-height:72px; padding:10px 26px; font-size:28px; }
  .listen { border:3px dashed var(--line); border-radius:22px; padding:22px; background:var(--panel); }
  .listen .big { font-size:34px; font-weight:900; color:var(--ink); }
  .meter { height:12px; background:#333; border-radius:8px; overflow:hidden; margin-top:14px; }
  .meter > i { display:block; height:100%; width:0; background:var(--ink); transition: width .2s linear; }
  .ask { border:4px solid var(--ink); border-radius:24px; padding:26px; background:#1a1700; margin: 16px 0; }
  .ask h2 { margin-bottom:16px; }
  input[type=text], textarea { width:100%; font:inherit; font-size:26px; padding:16px; border-radius:16px; border:3px solid var(--line); background:#111; color:#fff; margin-top:6px; }
  label.f { display:block; margin-top:16px; font-weight:700; font-size:24px; }
  .qr { background:#fff; border-radius:14px; padding:10px; line-height:0; display:inline-block; }
  .qr svg { width:150px; height:150px; }
  .attract { align-items:center; text-align:center; }
  .statusBox { border-radius:26px; padding:36px 24px; text-align:center; background:#1a1700; border:4px solid var(--ink); }
  .statusBox.helping { background:#0a5a2d; border-color:#2fbf71; }
  .statusBox.done { background:#12358a; border-color:var(--blue); }
  .statusBox .big { font-size: clamp(36px, 7vw, 68px); font-weight:900; line-height:1.1; }
  .nav { display:flex; gap:14px; margin-top:20px; }
  .nav .btn { flex:1; }
  [hidden] { display:none !important; }
  :focus-visible { outline: 5px solid #ff9f1c; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .meter > i { transition:none; } }
</style>
</head>
<body>
<div class="kiosk">
  <div class="bar"><span>Access Pro</span><span class="loc" id="locName"></span></div>

  <!-- 0 attract -->
  <section class="screen on attract" id="s0" aria-labelledby="a0">
    <h1 id="a0">Touch to check in</h1>
    <p class="sub">Toca para registrarte · 触摸登记 · Нажмите, чтобы зарегистрироваться</p>
    <p class="sub">No talking needed.</p>
    <button class="btn big" id="start" style="max-width:700px">Start</button>
    <p class="mute" style="margin-top:22px">Or scan with your phone:</p>
    <div class="qr" id="qr" role="img" aria-label="QR code to check in on your phone"></div>
  </section>

  <!-- 1 talk -->
  <section class="screen" id="s1" aria-labelledby="t1">
    <h2 id="t1"></h2>
    <p class="sub" id="t1sub"></p>
    <div class="listen">
      <div class="big" id="listenState"></div>
      <div class="meter" aria-hidden="true"><i id="meterBar"></i></div>
    </div>
    <div class="ask" id="askDeaf" hidden role="alert">
      <h2 id="askQ"></h2>
      <div class="row"><button class="btn" id="deafYes"></button><button class="btn alt" id="deafNo"></button></div>
    </div>
    <label class="f" for="typed" id="typedL"></label>
    <input type="text" id="typed" autocomplete="off">
    <p class="mute" style="margin-top:12px" id="tapLang"></p>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
    <div class="nav"><button class="btn alt" id="b1">Back</button><button class="btn" id="n1"></button></div>
  </section>

  <!-- 2 needs -->
  <section class="screen" id="s2" aria-labelledby="t2">
    <h2 id="t2"></h2>
    <div class="grid" id="needs"></div>
    <div class="nav"><button class="btn alt" id="b2"></button><button class="btn" id="n2"></button></div>
  </section>

  <!-- 3 follow-ups -->
  <section class="screen" id="s3" aria-labelledby="t3">
    <h2 id="t3"></h2>
    <div id="interpBox" hidden>
      <p class="sub" id="interpQ"></p>
      <div class="grid" id="interpOpts" role="group"></div>
    </div>
    <label class="f" for="preferred" id="prefL"></label>
    <input type="text" id="preferred" autocomplete="off">
    <label class="f" for="notes" id="notesL"></label>
    <textarea id="notes" rows="2"></textarea>
    <div class="nav"><button class="btn alt" id="b3"></button><button class="btn" id="n3"></button></div>
  </section>

  <!-- 4 sent -->
  <section class="screen" id="s4" aria-labelledby="t4">
    <div class="statusBox" id="statusBox" role="status" aria-live="polite">
      <div class="big" id="t4"></div>
      <p class="sub" id="t4sub" style="margin-top:14px"></p>
    </div>
    <p class="mute" id="disc" style="text-align:center;margin-top:16px"></p>
    <div class="row" style="justify-content:center"><button class="btn alt" id="over" style="max-width:420px"></button></div>
  </section>
</div>

<script src="qrcode.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  'use strict';
  var AP = window.AccessPro, $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var LOC = (q.get('loc') || 'Hospital reception').slice(0, 80);
  var SILENCE_MS = 6000, IDLE_MS = 60000, RESET_AFTER_DONE_MS = 45000;

  var UI = {
    en: { talkT: 'Say hello, or type. Or just wait.', talkSub: 'You can speak in any language. We will find it.', listening: 'Listening…', ready: 'Ready', typedL: 'Type here in your language', tapLang: 'Or tap your language:', askQ: 'Hello. Are you Deaf or hard of hearing? Do you use ASL?', yes: 'Yes', no: 'No', next: 'Next', back: 'Back', needsT: 'What do you need?', helpT: 'How can we help?', interpQ: 'How should we get your interpreter?', i1: 'Please book an interpreter for me', i2: 'I have my own interpreter', i3: 'A video interpreter is fine', prefL: 'Preferred doctor or interpreter (optional)', notesL: 'Anything else? (optional)', checkin: 'Check in', sent: 'Staff have been told', sentSub: 'You do not need to speak. Please wait here.', helping: 'Someone is coming to help you', done: 'All done. Thank you.', over: 'Start over', disc: 'This is a request, not a booking.', heard: 'Got it', noHear: 'We did not hear anything. That is fine.' },
    es: { talkT: 'Diga hola o escriba. O espere.', talkSub: 'Puede hablar en cualquier idioma. Lo encontraremos.', listening: 'Escuchando…', ready: 'Listo', typedL: 'Escriba aquí en su idioma', tapLang: 'O toque su idioma:', askQ: 'Hola. ¿Es usted sordo o con dificultad auditiva? ¿Usa ASL?', yes: 'Sí', no: 'No', next: 'Siguiente', back: 'Atrás', needsT: '¿Qué necesita?', helpT: '¿Cómo podemos ayudarle?', interpQ: '¿Cómo conseguimos su intérprete?', i1: 'Por favor, reserve un intérprete para mí', i2: 'Tengo mi propio intérprete', i3: 'Un intérprete por video está bien', prefL: 'Médico o intérprete preferido (opcional)', notesL: '¿Algo más? (opcional)', checkin: 'Registrarse', sent: 'Ya avisamos al personal', sentSub: 'No necesita hablar. Por favor espere aquí.', helping: 'Alguien viene a ayudarle', done: 'Listo. Gracias.', over: 'Empezar de nuevo', disc: 'Esto es una solicitud, no una reserva.', heard: 'Entendido', noHear: 'No escuchamos nada. No hay problema.' },
    zh: { talkT: '请说声你好，或打字。也可以等一等。', talkSub: '您可以用任何语言说话，我们会识别。', listening: '正在聆听…', ready: '准备好了', typedL: '请用您的语言在这里打字', tapLang: '或点击您的语言：', askQ: '您好。您是聋人或听力不佳吗？您使用ASL手语吗？', yes: '是', no: '否', next: '下一步', back: '返回', needsT: '您需要什么？', helpT: '我们如何帮助您？', interpQ: '我们如何为您安排口译员？', i1: '请为我预约口译员', i2: '我有自己的口译员', i3: '视频口译也可以', prefL: '首选医生或口译员（可选）', notesL: '还有其他需要吗？（可选）', checkin: '登记', sent: '已通知工作人员', sentSub: '您不需要说话，请在这里等候。', helping: '有人正在过来帮助您', done: '已完成，谢谢。', over: '重新开始', disc: '这是一份请求，不是预约。', heard: '明白了', noHear: '我们没有听到声音，没关系。' },
    ru: { talkT: 'Скажите «здравствуйте» или напишите. Или просто подождите.', talkSub: 'Можно говорить на любом языке. Мы его определим.', listening: 'Слушаем…', ready: 'Готово', typedL: 'Напишите здесь на вашем языке', tapLang: 'Или нажмите ваш язык:', askQ: 'Здравствуйте. Вы глухой или слабослышащий? Вы используете ASL?', yes: 'Да', no: 'Нет', next: 'Далее', back: 'Назад', needsT: 'Что вам нужно?', helpT: 'Чем мы можем помочь?', interpQ: 'Как нам найти вам переводчика?', i1: 'Пожалуйста, закажите мне переводчика', i2: 'У меня есть свой переводчик', i3: 'Видеопереводчик подойдёт', prefL: 'Предпочитаемый врач или переводчик (необязательно)', notesL: 'Что-то ещё? (необязательно)', checkin: 'Зарегистрироваться', sent: 'Сотрудникам сообщили', sentSub: 'Говорить не нужно. Пожалуйста, подождите здесь.', helping: 'К вам идёт помощник', done: 'Готово. Спасибо.', over: 'Начать заново', disc: 'Это просьба, а не бронирование.', heard: 'Понятно', noHear: 'Мы ничего не услышали. Это нормально.' }
  };
  var INTERP = [{ k: 'i1', en: 'Book an interpreter for me' }, { k: 'i2', en: 'I have my own interpreter' }, { k: 'i3', en: 'Video interpreter is OK' }];

  var lang = 'en', needs = {}, interp = null, step = 0, myId = null, poll = null;
  var timer = null, tick = null, recog = null, listening = false, idleT = null, resetT = null;
  function U() { return UI[lang] || UI.en; }

  function show(n) {
    step = n;
    for (var i = 0; i <= 4; i++) $('s' + i).classList.toggle('on', i === n);
    window.scrollTo(0, 0);
    idleReset();
  }
  function idleReset() {
    clearTimeout(idleT);
    if (step > 0 && step < 4) idleT = setTimeout(resetAll, IDLE_MS);
  }
  ['click', 'keydown', 'touchstart', 'input'].forEach(function (ev) { document.addEventListener(ev, idleReset, { passive: true }); });

  function resetAll() {
    stopListening(); clearInterval(poll); clearTimeout(resetT); clearTimeout(idleT);
    lang = 'en'; needs = {}; interp = null; myId = null;
    $('typed').value = ''; $('preferred').value = ''; $('notes').value = ''; $('askDeaf').hidden = true;
    render(); show(0);
  }

  /* ---------- text + widgets for current language ---------- */
  function render() {
    var u = U(), L = AP.T[lang] || AP.T.en;
    document.documentElement.lang = lang;
    $('t1').textContent = u.talkT; $('t1sub').textContent = u.talkSub; $('typedL').textContent = u.typedL; $('tapLang').textContent = u.tapLang;
    $('askQ').textContent = u.askQ; $('deafYes').textContent = u.yes; $('deafNo').textContent = u.no;
    $('b1').textContent = u.back; $('n1').textContent = u.next;
    $('t2').textContent = u.needsT; $('b2').textContent = u.back; $('n2').textContent = u.next;
    $('t3').textContent = u.helpT; $('interpQ').textContent = u.interpQ; $('prefL').textContent = u.prefL; $('notesL').textContent = u.notesL;
    $('b3').textContent = u.back; $('n3').textContent = u.checkin; $('over').textContent = u.over; $('disc').textContent = u.disc;
    if (!listening) $('listenState').textContent = u.ready;
    var lb = $('langs'); lb.innerHTML = '';
    Object.keys(AP.LANGS).forEach(function (c) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.textContent = AP.LANGS[c].name;
      b.setAttribute('aria-pressed', c === lang ? 'true' : 'false');
      b.addEventListener('click', function () { setLang(c); });
      lb.appendChild(b);
    });
    var nb = $('needs'); nb.innerHTML = '';
    AP.NEED_IDS.forEach(function (id) {
      var lab = document.createElement('label'); lab.className = 'opt';
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!needs[id];
      cb.addEventListener('change', function () { needs[id] = cb.checked; });
      var sp = document.createElement('span'); sp.textContent = L.needs[id];
      lab.appendChild(cb); lab.appendChild(sp); nb.appendChild(lab);
    });
    var ib = $('interpOpts'); ib.innerHTML = '';
    INTERP.forEach(function (o) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.textContent = u[o.k];
      b.setAttribute('aria-pressed', interp === o.en ? 'true' : 'false');
      b.addEventListener('click', function () { interp = interp === o.en ? null : o.en; render3(); });
      ib.appendChild(b);
    });
    if (step === 4) paintStatus(lastStatus);
  }
  function render3() { var ib = $('interpOpts').children; INTERP.forEach(function (o, i) { ib[i].setAttribute('aria-pressed', interp === o.en ? 'true' : 'false'); }); }
  function setLang(c) { lang = c; render(); }

  /* ---------- listening: speak / silence / type ---------- */
  function stopListening() {
    listening = false; clearTimeout(timer); clearInterval(tick); $('meterBar').style.width = '0';
    if (recog) { try { recog.stop(); } catch (e) { /* ignore */ } recog = null; }
  }
  function heard(text) {
    var c = AP.detectLang(text);
    stopListening();
    if (c) setLang(c);
    $('askDeaf').hidden = true;
    $('listenState').textContent = U().heard;
  }
  function startListening() {
    stopListening(); listening = true; $('askDeaf').hidden = true; $('listenState').textContent = U().listening;
    var t0 = Date.now();
    tick = setInterval(function () { $('meterBar').style.width = Math.min(100, (Date.now() - t0) / SILENCE_MS * 100) + '%'; }, 200);
    timer = setTimeout(function () { // silence: ask, never assume
      stopListening(); $('listenState').textContent = U().noHear; $('askDeaf').hidden = false; $('deafYes').focus();
    }, SILENCE_MS);
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      try {
        recog = new SR(); recog.lang = ''; recog.interimResults = false; recog.maxAlternatives = 1;
        recog.onresult = function (e) { var t = e.results[0][0].transcript; if (t) heard(t); };
        recog.onerror = function () { /* keep waiting; silence prompt will ask */ };
        recog.start();
      } catch (e) { /* typing and taps still work */ }
    }
  }
  var typedTimer;
  $('typed').addEventListener('input', function () { var v = this.value; clearTimeout(typedTimer); typedTimer = setTimeout(function () { if (v.trim().length > 1) heard(v); }, 500); });
  $('deafYes').addEventListener('click', function () { needs.asl = true; needs.written = true; $('askDeaf').hidden = true; $('listenState').textContent = U().heard; });
  $('deafNo').addEventListener('click', function () { $('askDeaf').hidden = true; $('listenState').textContent = U().ready; });

  /* ---------- navigation ---------- */
  $('start').addEventListener('click', function () { show(1); render(); startListening(); });
  $('b1').addEventListener('click', function () { stopListening(); show(0); });
  $('n1').addEventListener('click', function () { stopListening(); show(2); });
  $('b2').addEventListener('click', function () { show(1); });
  $('n2').addEventListener('click', function () { $('interpBox').hidden = !(needs.asl || needs.langInterp); show(3); });
  $('b3').addEventListener('click', function () { show(2); });
  $('over').addEventListener('click', resetAll);

  var lastStatus = 'waiting';
  function paintStatus(status) {
    lastStatus = status; var u = U();
    $('statusBox').className = 'statusBox' + (status === 'helping' ? ' helping' : status === 'done' ? ' done' : '');
    $('t4').textContent = status === 'helping' ? u.helping : status === 'done' ? u.done : u.sent;
    $('t4sub').textContent = status === 'waiting' ? u.sentSub : '';
  }
  $('n3').addEventListener('click', function () {
    $('n3').disabled = true;
    var list = AP.NEED_IDS.filter(function (n) { return needs[n]; });
    var notes = [];
    if (interp && !$('interpBox').hidden) notes.push(interp);
    if ($('notes').value.trim()) notes.push($('notes').value.trim());
    AP.sendCheckin({ loc: LOC, needs: list, lang: lang, preferred: $('preferred').value.trim(), notes: notes.join('. '), via: 'kiosk' }).then(function (e) {
      $('n3').disabled = false; myId = e.id; paintStatus('waiting'); show(4);
      clearInterval(poll);
      poll = setInterval(function () {
        AP.listCheckins().then(function (l) {
          var me = l.filter(function (c) { return c.id === myId; })[0];
          if (me && me.status !== lastStatus) {
            paintStatus(me.status);
            if (me.status === 'done') { clearInterval(poll); resetT = setTimeout(resetAll, RESET_AFTER_DONE_MS); }
          }
        });
      }, 2000);
    });
  });

  /* ---------- QR for phones ---------- */
  function drawQr() {
    var base = location.protocol === 'file:' ? 'http://192.168.1.20:3000' : location.origin;
    var url = base + '/checkin.html?loc=' + encodeURIComponent(LOC);
    try { var qr = qrcode(0, 'M'); qr.addData(url); qr.make(); $('qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true }); } catch (e) { $('qr').textContent = ''; }
    AP.ping().then(function (on) {
      if (!on || !/localhost|127\.0\.0\.1/.test(base)) return;
      var info = AP.serverInfo(); if (!info.lan || !info.lan.length) return;
      try { var q2 = qrcode(0, 'M'); q2.addData(info.lan[0] + '/checkin.html?loc=' + encodeURIComponent(LOC)); q2.make(); $('qr').innerHTML = q2.createSvgTag({ cellSize: 6, margin: 0, scalable: true }); } catch (e) { /* ignore */ }
    });
  }

  $('locName').textContent = LOC;
  render(); drawQr(); show(0);
  // Hand-off from welcome.html: language and the Deaf/ASL answer carry over, then skip to the needs screen.
  try {
    var w = JSON.parse(sessionStorage.getItem('accesspro.welcome') || 'null');
    sessionStorage.removeItem('accesspro.welcome');
    if (w && q.get('from') === 'welcome') {
      if (AP.LANGS[w.lang]) lang = w.lang;
      if (w.deaf === true) { needs.asl = true; needs.written = true; }
      render(); show(2);
    }
  } catch (e) { /* ignore */ }
  window.__kiosk = { setLang: setLang, heard: heard, go: show, state: function () { return { lang: lang, needs: needs, step: step }; } };
})();
</script>
</body>
</html>
